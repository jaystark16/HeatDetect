name: Keep API warm

# Render's free tier spins a service down when idle, and the first request after
# that can take most of a minute. A judge clicking the demo link and seeing a
# blank page for 50 seconds is a real way to lose marks, so this pings the health
# endpoint often enough to keep the instance up.
#
# Set the repository variable API_BASE_URL (Settings → Secrets and variables →
# Actions → Variables) to the Render service URL once it exists. Until then this
# workflow no-ops instead of failing.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is not set yet — nothing to keep warm."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$API_BASE_URL/api/health")
          echo "GET $API_BASE_URL/api/health -> $code"
          test "$code" = "200"
