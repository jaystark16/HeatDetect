name: Deploy assistant proxy

# Deploys proxy/worker.mjs to Cloudflare Workers: the only place the model API
# keys live. Each key goes from a GitHub secret straight into the Worker's
# encrypted secrets; it is never in the repository, the website or a log.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   required; a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  required; from the Cloudflare dashboard
#   OLLAMA_API_KEY         Ollama Cloud key; enables /ollama/chat (answers first)
#   GEMINI_API_KEY         Google AI Studio key; enables /generate (fallback)
# At least one model key is needed. Once the first deploy prints the Worker's
# URL, set the repository variable ASSISTANT_URL to it and re-run the Pages
# deploy, so the website knows where to call.

on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$OLLAMA$GEMINI" ] || missing="$missing OLLAMA_API_KEY-or-GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "Ollama key present: $([ -n "$OLLAMA" ] && echo yes || echo no)"
          echo "Gemini key present: $([ -n "$GEMINI" ] && echo yes || echo no)"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy

      # Uploaded one by one, and only when present: an empty secret would
      # switch a route on with no key behind it.
      - name: Upload model keys to the Worker
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$OLLAMA_API_KEY" ]; then
            printf '%s' "$OLLAMA_API_KEY" | npx --yes wrangler@4 secret put OLLAMA_API_KEY
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          fi

      - name: Health check
        env:
          URL: ${{ vars.ASSISTANT_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::Set the repository variable ASSISTANT_URL to the workers.dev URL printed above, then re-run the Pages deploy."
            exit 0
          fi
          curl -fsS "$URL/health"
