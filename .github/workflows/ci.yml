name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The FIRMS key is a 32-character hex string. Catching it here is cheaper
      # than rotating it after it reaches a public repo.
      - name: Scan for a leaked FIRMS MAP_KEY
        run: |
          if git grep -nIE 'FIRMS_MAP_KEY[[:space:]]*=[[:space:]]*[0-9a-f]{16,}' -- . ':!*.example'; then
            echo "::error::A FIRMS MAP_KEY looks committed. Remove it and rotate the key."
            exit 1
          fi

      - name: Ensure no .env file is tracked
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env is tracked. It must stay untracked."
            exit 1
          fi
