name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — tests & evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: python -m pytest -q

      # Run the behavioural suite separately too, so its report appears in the
      # log rather than only as a pass/fail inside pytest.
      - name: Behavioural evaluation
        run: python -m evals.run

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The FIRMS key is a 32-character hex string. Catching it here is cheaper
      # than rotating it after it reaches a public repository.
      - name: No committed API keys
        run: |
          if git grep -nIE '(FIRMS_MAP_KEY|MAP_KEY)[[:space:]]*=[[:space:]]*[0-9a-f]{16,}' -- . ':!*.example'; then
            echo "::error::A FIRMS MAP_KEY looks committed. Remove it and rotate the key."
            exit 1
          fi

      # Fake credentials are legitimate in the redaction tests and in the
      # comment documenting what the redactor matches. Rather than excluding
      # those files wholesale — which would let a real leak hide in a test —
      # each deliberate occurrence must carry an explicit marker. A real leak
      # will not have one.
      - name: No committed database URL with credentials
        run: |
          hits=$(git grep -nIE 'postgres(ql)?://[^:]+:[^@]+@' -- . ':!*.example' ':!docs/**' \
                 | grep -v 'pragma: fake-credential' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A database URL with a password looks committed."
            exit 1
          fi

      # The reported metrics went stale three times during development, once
      # badly enough that the UI asserted a figure that had since changed.
      # The README block is generated; this makes drift a build failure.
      - name: README metrics match the trained model
        # stdlib only, so no install step is needed.
        run: python scripts/sync_docs.py --check

      - name: No tracked .env
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env is tracked. It must stay untracked."
            exit 1
          fi

      # The project's core discipline is that served data is real and labelled.
      # A module reintroducing hand-written "sample" observations would quietly
      # undo that, so its return is treated as a build failure.
      - name: No fabricated sample-data module
        run: |
          if git ls-files --error-unmatch backend/app/sample_data.py >/dev/null 2>&1; then
            echo "::error::backend/app/sample_data.py is back. Served data must come from the pipeline."
            exit 1
          fi
